<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Latin Quiz — Nouns, Verbs & Pronouns</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #131313; color: #fff;
    font-family: Arial, Helvetica, sans-serif;
    display: flex; justify-content: center; padding: 16px;
    min-height: 100vh;
  }
  .page { width: 100%; max-width: 1080px; }

  /* ---- group switcher + quiz picker ---- */
  .groupbar { display: flex; justify-content: center; margin-bottom: 16px; }
  .groupbar .seg {
    display: inline-flex; background: #1e1e1e; border: 1px solid #3a3a3a;
    border-radius: 999px; padding: 4px; gap: 2px;
  }
  .gbtn {
    background: transparent; border: 0; color: #9e9e9e; font-size: 13px; font-weight: bold;
    letter-spacing: 2px; text-transform: uppercase; padding: 8px 22px; border-radius: 999px;
    cursor: pointer; font-family: inherit;
  }
  .gbtn:hover { color: #fff; }
  .gbtn.active { background: #4a90e2; color: #fff; }
  .tabs { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-bottom: 20px; }
  .tabs button.tab {
    flex: 0 1 160px; background: #1e1e1e; color: #fff; border: 1px solid #3a3a3a; border-radius: 12px;
    padding: 10px 12px; cursor: pointer; font-family: inherit;
    display: flex; flex-direction: column; gap: 2px; align-items: center; justify-content: center;
  }
  .tabs button.tab:hover { border-color: #4a90e2; }
  .tabs button.tab.active { background: #4a90e2; border-color: #4a90e2; }
  .tabs button.tab .t { font-size: 15px; font-weight: bold; }
  .tabs button.tab .s { font-size: 12px; color: #9e9e9e; font-weight: normal; }
  .tabs button.tab.active .s { color: rgba(255,255,255,.85); }

  /* ---- forced-order toggle ---- */
  .orderrow { display: flex; justify-content: center; align-items: center; gap: 18px; margin-bottom: 20px; }
  .orderrow button {
    background: none; border: 0; color: #9e9e9e; font-size: 14px;
    cursor: pointer; font-family: inherit; padding: 4px 8px;
  }
  .orderrow button b { color: #fff; }
  .orderrow button:hover { color: #fff; }
  /* ---- hero row: PLAY QUIZ + Learn + Score + Timer ---- */
  .hero { display: flex; align-items: center; gap: 24px; margin-bottom: 20px; flex-wrap: wrap; }
  #playBtn {
    background: #4a90e2; color: #fff; border: 0; border-radius: 999px;
    font-size: 30px; font-weight: 800; letter-spacing: 1px;
    padding: 18px 0; flex: 1 1 320px; max-width: 460px; cursor: pointer; font-family: inherit;
  }
  #playBtn:hover { background: #357abd; }
  #playBtn:disabled { opacity: .55; cursor: default; }
  #learnBtn {
    background: transparent; color: #fff; border: 2px solid #fff; border-radius: 999px;
    font-size: 19px; font-weight: bold; padding: 14px 34px; cursor: pointer;
    display: flex; align-items: center; gap: 10px; font-family: inherit;
  }
  #learnBtn:hover { background: #2a2a2a; }
  #learnBtn.active { background: #fff; color: #000; }
  .spacer { flex: 1; }
  .stat { text-align: center; min-width: 130px; }
  .stat .lbl { color: #9e9e9e; font-size: 14px; letter-spacing: 1px; margin-bottom: 6px; }
  .stat .val { font-size: 56px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }

  /* ---- answer input ---- */
  #answerWrap { display: none; margin: 0 auto 16px; max-width: 640px; }
  #answer {
    flex: 1; min-width: 0; font-size: 20px; text-align: center; padding: 13px;
    background: #1e1e1e; color: #fff; border: 2px solid #4a90e2; border-radius: 12px;
    outline: none; font-family: inherit;
  }
  #answer::placeholder { color: #777; }
  #answer:disabled { opacity: .4; }
  .answerrow { display: flex; gap: 8px; }
  .answerrow input { flex: 1; min-width: 0; }
  #submitBtn {
    background: #4a90e2; color: #fff; border: 0; border-radius: 12px;
    font-size: 16px; font-weight: bold; padding: 0 22px; cursor: pointer; font-family: inherit;
    white-space: nowrap;
  }
  #submitBtn:hover { background: #357abd; }
  #submitBtn:disabled { opacity: .4; cursor: default; }
  #hint { text-align: center; min-height: 22px; font-size: 14px; color: #9e9e9e; margin-bottom: 10px; }
  #nowQ { display: none; text-align: center; font-size: 24px; font-weight: 800; margin-bottom: 10px; }
  #nowQ .qarrow { color: #4a90e2; }
  #hint.bad { color: #ff8a80; }
  #hint.good { color: #7fdb8f; }

  /* ---- the grid ---- */
  table.sheet { width: 100%; border-collapse: collapse; table-layout: fixed; }
  table.sheet th {
    background: #4a90e2; color: #fff; font-size: 19px; font-weight: 800;
    padding: 10px 12px; text-align: center; border: 0;
  }
  table.sheet td {
    border: 0; border-bottom: 1px solid #000;
    padding: 0; font-size: 16px; text-align: center; color: #000; height: 40px;
  }
  table.sheet td.hintcell { background: #d9e8fb; width: 40%; }
  table.sheet td.answercell { background: #fff; width: 60%; font-weight: bold; }
  table.sheet td.answercell.next {
    box-shadow: inset 0 0 0 3px #4a90e2;
  }
  table.sheet td.answercell.filled { background: #fff; color: #1b7f37; }
  table.sheet td.answercell.missed { background: #f4cccc; color: #a50e0e; }
  table.sheet td span.celltext { display: block; padding: 8px; }

  .btnrow { display: flex; gap: 10px; justify-content: center; margin: 16px 0 8px; flex-wrap: wrap; }
  .btnrow button {
    background: #2a2a2a; color: #fff; border: 1px solid #555; border-radius: 999px;
    padding: 9px 22px; font-size: 14px; font-weight: bold; cursor: pointer; font-family: inherit;
  }
  .btnrow button:hover { background: #3a3a3a; }
  .foot { text-align: center; color: #777; font-size: 12px; margin-top: 12px; padding-bottom: 12px; }
  button, select { transition: background-color .15s, border-color .15s, color .15s, opacity .15s; }
  .mcoptcell { transition: background-color .15s, box-shadow .15s; }
  button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid #8fbef5; outline-offset: 2px; }

  /* ---- vocab tester setup (mockup style) ---- */
  .vsetup { max-width: 640px; margin: 0 auto; text-align: center; }
  .vsetup .vlabel { font-size: 19px; font-weight: 800; margin: 16px 0 12px; }
  .vsetup .vlabel:first-child { margin-top: 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .chip {
    background: #1e1e1e; border: 1px solid #3a3a3a; color: #cfcfcf; border-radius: 12px;
    padding: 9px 16px; font-size: 14px; font-weight: bold; cursor: pointer; font-family: inherit;
  }
  .chip small { font-weight: normal; opacity: .65; }
  .chip.on { background: #4a90e2; border-color: #4a90e2; color: #fff; }
  .chip.on small { color: rgba(255,255,255,.8); }
  select.vmodesel {
    width: 100%; background: #3a3a3a; color: #fff; border: 0; border-radius: 12px;
    font-size: 19px; padding: 15px 16px; font-family: inherit; outline: none; cursor: pointer;
  }
  .tabs.locked { opacity: .55; }
  .tabs.locked .tab, .tabs.locked .vsetup { pointer-events: none; }

  /* ---- multiple choice options (same table look as type-in) ---- */
  .mcoptcell { background: #fff; cursor: pointer; }
  .mcoptcell:hover { box-shadow: inset 0 0 0 3px #4a90e2; }
  .mcoptcell.right { background: #d9ead3; color: #1b7f37; }
  .mcoptcell.wrong { background: #f4cccc; color: #a50e0e; }
  table.sheet.mcqt { border-collapse: separate; border-spacing: 6px; }
  table.sheet.mcqt th, table.sheet.mcqt td { border: 0; border-radius: 12px; }
  table.sheet.mcqt td.hintcell { width: 56px; background: #4a90e2; color: #fff; font-weight: 800; font-size: 17px; }
  table.sheet.mcqt td.mcoptcell { border: 1px solid #000; }
  table.sheet.missed-only { max-width: 640px; margin: 0 auto 8px; }

  /* ---- fill-in grid tables (like the doc) ---- */
  .tablewrap { overflow-x: auto; border-radius: 12px; }
  table.sheet.grid { table-layout: auto; }
  table.sheet.grid td, table.sheet.grid th.colhead { border: 1px solid #000; }
  table.sheet.grid th.colhead { background: #fff; color: #000; font-size: 15px; }
  table.sheet.grid td.corner { background: #d9d9d9; font-weight: bold; padding: 8px; min-width: 110px; }
  table.sheet.grid td.rowhead { background: #d9e8fb; padding: 8px; min-width: 130px; }
  table.sheet.grid td.mcell { background: #fff; min-width: 96px; vertical-align: middle; }
  .cellans { display: block; font-weight: bold; min-height: 20px; }
  table.sheet.grid td.mcell.next { box-shadow: inset 0 0 0 3px #4a90e2; }
  table.sheet.grid td.mcell.filled .cellans { color: #1b7f37; }
  table.sheet.grid td.mcell.missed { background: #f4cccc; }
  table.sheet.grid td.mcell.missed .cellans { color: #a50e0e; }

  @media (max-width: 800px) {
    .hero { gap: 16px; }
    #nowQ { font-size: 20px; }
    #playBtn { font-size: 22px; width: 100%; max-width: none; }
    .stat { flex: 1; min-width: 0; }
    .stat .val { font-size: 38px; }
  }
</style>
</head>
<body>
<div class="page">

  <div class="groupbar"><div class="seg" id="groupseg"></div></div>
  <div class="tabs" id="tabs"></div>
  <div class="orderrow" id="orderrow" style="display:none">

</div>

<script>
// ---------- builders ----------
// matrixQuiz keeps the real table shape (rows x cols) and also builds the
// flat hints/answers the game logic runs on (row-major order).
function matrixQuiz(o){
  const hints = [], flat = [];
  o.rows.forEach((r,i)=>o.cols.forEach((c,j)=>{ hints.push(`${r} — ${c}`); flat.push(o.answers[i][j]); }));
  return { title:o.title, sub:o.sub, hints, answers:flat,
    rows:o.rows, cols:o.cols, corner:o.corner||"",
    colGroups:o.colGroups||null, groupCorner:o.groupCorner||"",
    cellPrefix:o.cellPrefix||null, matrix:o.answers };
}

// ---------- vocabulary ----------
let vocabDir = "la-en"; // or "en-la"
function vocabQuiz(title, sub, pairs){
  return { title, sub, vocab:true, pairs, hints:[], answers:[] };
}
function applyDir(q){
  if (vocabDir === "la-en"){ q.hints = q.pairs.map(p=>p[0]); q.answers = q.pairs.map(p=>p[1]); }
  else { q.hints = q.pairs.map(p=>p[1]); q.answers = q.pairs.map(p=>p[0]); }
}

    answers:[["doceo","docebam","docui"],["doces","docebas","docuisti"],
             ["docet","docebat","docuit"],["docemus","docebamus","docuimus"],
             ["docetis","docebatis","docuistis"],["docent","docebant","docuerunt"]] }),
  conj3: matrixQuiz({ title:"3rd Conjugation", sub:"traho", corner:"",
    rows:["I","You","He/She/It","We","You (pl.)","They"],
    cols:["Present tense","Imperfect tense","Perfect Tense"],
    answers:[["traho","trahebam","traxi"],["trahis","trahebas","traxisti"],
             ["trahit","trahebat","traxit"],["trahimus","trahebamus","traximus"],
             ["trahitis","trahebatis","traxistis"],["trahunt","trahebant","traxerunt"]] }),
  conj4: matrixQuiz({ title:"4th Conjugation", sub:"audio", corner:"",
    rows:["I","You","He/She/It","We","You (pl.)","They"],
    cols:["Present tense","Imperfect tense","Perfect Tense"],
    answers:[["audio","audiebam","audivi"],["audis","audiebas","audivisti"],
             ["audit","audiebat","audivit"],["audimus","audiebamus","audivimus"],
             ["auditis","audiebatis","audivistis"],["audiunt","audiebant","audiverunt"]] }),

  // ----- pronouns -----
  personal: matrixQuiz({ title:"Personal Pronouns", sub:"20 forms",
    groupCorner:"NUMBER:", colGroups:["SINGULAR","SINGULAR","PLURAL","PLURAL"],
    corner:"PERSON:", cols:["1","2","1","2"],
    rows:["NOMINATIVE","ACCUSATIVE","DATIVE","GENITIVE","ABLATIVE"],
    answers:[["ego","tu","nos","vos"],
     ["me","te","nos","vos"],
     ["mihi","tibi","nobis","vobis"],
     ["mei","tui","nostrum","vestrum"],
     ["me","te","nobis","vobis"]] }),
  relative: matrixQuiz({ title:"Relative — Who", sub:"10 forms", corner:"",
    rows:["NOMINATIVE","ACCUSATIVE","DATIVE","GENITIVE","ABLATIVE"],
    cols:["SINGULAR","PLURAL"],
    answers:[["quis","qui"],
     ["quem","quos"],
     ["cui","quibus"],
     ["cuius","quorum"],
     ["quo","quibus"]] }),
  hic: matrixQuiz({ title:"Demonstrative — This (hic)", sub:"12 forms",
    groupCorner:"NUMBER:", colGroups:["SINGULAR","SINGULAR","SINGULAR","PLURAL","PLURAL","PLURAL"],
    corner:"GENDER:", cols:["MASCULINE","FEMININE","NEUTER","MASCULINE","FEMININE","NEUTER"],
    rows:["NOMINATIVE","ACCUSATIVE"],
    answers:[["hic","haec","hoc","hi","hae","haec"],
     ["hunc","hanc","hoc","hos","has","haec"]] }),
  ille: matrixQuiz({ title:"Demonstrative — That (ille)", sub:"12 forms",
    groupCorner:"NUMBER:", colGroups:["SINGULAR","SINGULAR","SINGULAR","PLURAL","PLURAL","PLURAL"],
    corner:"GENDER:", cols:["MASCULINE","FEMININE","NEUTER","MASCULINE","FEMININE","NEUTER"],
    rows:["NOMINATIVE","ACCUSATIVE"],
    answers:[["ille","illa","illud","illi","illae","illa"],
     ["illum","illam","illud","illos","illas","illa"]] }),
  v1: vocabQuiz("Stage 1", "29 words", VOCAB[1]),
  v2: vocabQuiz("Stage 2", "29 words", VOCAB[2]),
  v3: vocabQuiz("Stage 3", "26 words", VOCAB[3]),
  v4: vocabQuiz("Stage 4", "27 words", VOCAB[4]),
  v5: vocabQuiz("Stage 5", "30 words", VOCAB[5]),
  v6: vocabQuiz("Stage 6", "30 words", VOCAB[6]),
  v7: vocabQuiz("Stage 7", "29 words", VOCAB[7]),
  v8: vocabQuiz("Stage 8", "46 words", VOCAB[8]),
  vall: vocabQuiz("All Stages (1–8)", "", [].concat(VOCAB[1],VOCAB[2],VOCAB[3],VOCAB[4],VOCAB[5],VOCAB[6],VOCAB[7],VOCAB[8]))
};
DATA.vall.sub = DATA.vall.pairs.length + " words";

const GROUPS = [
  { label:"Nouns",    ids:["puella","amicus","templum","mercator","nomen"] },
  { label:"Verbs",    ids:["future","irregular","compounds","conj1","conj2","conj3","conj4"] },
  { label:"Pronouns", ids:["personal","relative","hic","ille"] },
  { label:"Vocab", ids:["v1","v2","v3","v4","v5","v6","v7","v8","vall"] }
];

// ~15s per form, min 3:00, max 45:00
const quizTime = n => Math.min(2700, Math.max(180, n * 15));
function resolveTime(n){
  if (activeGroup === "Vocab" && vocabTime !== "auto")
    return vocabTime === "none" ? null : parseInt(vocabTime, 10);
  return quizTime(n);
}
function timeLeft(){ return noTimer ? `in ${fmt(secs)}` : `with ${fmt(Math.max(secs,0))} left`; }

let current = "puella";
let total = 10;
let playing = false, learning = false;
let filled = [], score = 0, secs = 180, timerId = null;
let selCh = new Set([1]);
let vocabMode = "mc";
let vocabTime = "auto";
let noTimer = false;
let mcActive = false, mc = null;
const TOTALV = [1,2,3,4,5,6,7,8].reduce((a,c)=>a+VOCAB[c].length,0);

const $ = id => document.getElementById(id);
const norm = s => s.trim().toLowerCase().replace(/ā/g,"a").replace(/ē/g,"e").replace(/ī/g,"i").replace(/ō/g,"o").replace(/ū/g,"u");
const splitAlt = a => [norm(a), ...norm(a).split(",").map(s=>s.trim()).filter(Boolean)];
const fmt = s => `${String(Math.floor(s/60)).padStart(2,"0")}:${String(s%60).padStart(2,"0")}`;

// group switcher + quiz picker (only the active group's quizzes shown)
let activeGroup = GROUPS[0].label;
GROUPS.forEach(g => {
  const b = document.createElement("button");
  b.className = "gbtn";
  b.textContent = g.label;
  b.dataset.group = g.label;
  b.onclick = () => {
    if (g.label === activeGroup) return;
    stopGame();
    activeGroup = g.label;
    renderGroupbar();
    renderQuizTabs();
    if (g.label === "Vocab") selectVocab(); else select(g.ids[0]);
  };
  $("groupseg").appendChild(b);
});
function renderGroupbar(){
  document.querySelectorAll("#groupseg .gbtn").forEach(b => b.classList.toggle("active", b.dataset.group === activeGroup));
}
function renderVocabSetup(){
  $("tabs").innerHTML = `<div class="vsetup">
    <div class="vlabel">Choose Chapters</div>
    <div class="chips" id="chchips"></div>
    <div class="vlabel">Mode</div>
    <select class="vmodesel" id="vocabMode">
      <option value="mc">Multiple choice</option>
      <option value="type">Type-in</option>
    </select>
    <div class="vlabel">Time</div>
    <select class="vmodesel" id="vocabTime">
      <option value="auto">Auto</option>
      <option value="300">5:00</option>
      <option value="600">10:00</option>
      <option value="1200">20:00</option>
      <option value="2700">45:00</option>
      <option value="none">No limit</option>
    </select>
  </div>`;
  const cc = $("chchips");
  for (let c = 1; c <= 8; c++){
    const b = document.createElement("button");
    b.className = "chip" + (selCh.has(c) ? " on" : "");
    b.innerHTML = `Chapter ${c} <small>${VOCAB[c].length}</small>`;
    b.onclick = () => toggleChapter(c);
    cc.appendChild(b);
  }
  const all = document.createElement("button");
  all.className = "chip" + (selCh.size === 8 ? " on" : "");
  all.innerHTML = `All <small>${TOTALV}</small>`;
  all.onclick = toggleAllChapters;
  cc.appendChild(all);
  $("vocabMode").value = vocabMode;
  $("vocabMode").onchange = e => { vocabMode = e.target.value; };
  $("vocabTime").value = vocabTime;
  $("vocabTime").onchange = e => { vocabTime = e.target.value; if (!playing) selectVocab(); };
}
function toggleChapter(c){
  if (playing) return;
  if (selCh.has(c)) selCh.delete(c); else selCh.add(c);
  if (!selCh.size) selCh.add(c);
  renderQuizTabs();
  selectVocab();
}
function toggleAllChapters(){
  if (playing) return;
  selCh = new Set([1,2,3,4,5,6,7,8]);
  renderQuizTabs();
  selectVocab();
}
function renderQuizTabs(){
  if (activeGroup === "Vocab"){ renderVocabSetup(); return; }
  $("tabs").innerHTML = "";
  GROUPS.find(x => x.label === activeGroup).ids.forEach(k => {
    const b = document.createElement("button");
    b.className = "tab";
    b.innerHTML = `<span class="t">${DATA[k].title}</span><span class="s">${DATA[k].sub}</span>`;
    b.dataset.quiz = k;
    b.onclick = () => { stopGame(); select(k); };
    $("tabs").appendChild(b);
  });
}

function select(k){
  current = k;
  if (DATA[k].vocab) applyDir(DATA[k]);
  total = DATA[k].hints.length;
  $("orderrow").style.display = "none";
  updateHeroLabels();
  document.querySelectorAll("#tabs button.tab").forEach(b => b.classList.toggle("active", b.dataset.quiz === k));
  learning = false; $("learnBtn").classList.remove("active");
  $("foot").textContent = `${fmt(quizTime(total))} on the clock · ${total} forms · type the Latin. Answers checked case-insensitively.`;
  resetGrid();
}
function resetGrid(){
  stopTimer(); playing = false;
  filled = Array(total).fill(false); score = 0;
  { const lim = resolveTime(total); secs = lim === null ? 0 : lim; $("timer").textContent = lim === null ? "∞" : fmt(secs); }
  $("score").textContent = `0/${total}`;
  $("playBtn").disabled = false; updateHeroLabels();
  $("answerWrap").style.display = "none"; $("giveupRow").style.display = "none";
  $("tabs").classList.remove("locked");
  $("hint").className = ""; $("hint").textContent = "";
  renderGrid();
}
function renderGrid(){
  const d = DATA[current];
  if (d.rows) renderMatrix(d); else renderList(d);
  updateNowQ();
}
function updateNowQ(){
  const el = $("nowQ");
  if (!playing){ el.style.display = "none"; return; }
  const d = DATA[current];
  const remaining = filled.filter(f => f !== true).length;
  if (remaining === 0){ el.style.display = "none"; return; }
  el.style.display = "block";
  el.innerHTML = `${remaining} left <span class="qarrow">— type any!</span>`;
}
function gridListHTML(d){
  const nx = -1;
  let html = `<table class="sheet"><tr><th style="width:40%">Hint</th><th style="width:60%">${d.title}</th></tr><tbody>`;
  d.hints.forEach((h,i) => {
    let cls = "answercell", txt = "";
    if (learning) { txt = d.answers[i]; }
    else if (playing && filled[i]) { cls += " filled"; txt = d.answers[i]; }
    else if (!playing && filled[i] === "missed") { cls += " missed"; txt = d.answers[i]; }
    else if (playing && i === nx) { cls += " next"; }
    html += `<tr><td class="hintcell">${h}</td><td class="${cls}"><span class="celltext">${txt}</span></td></tr>`;
  });
  return html + `</tbody></table>`;
}
function renderList(d){
  if (playing && !learning && d.vocab){ $("tablewrap").innerHTML = ""; return; }
  $("tablewrap").innerHTML = gridListHTML(d);
}
function renderMatrix(d){
  const C = d.cols.length;
  const nx = -1;
  let html = `<table class="sheet grid"><tr><th colspan="${C+1}">${d.title}</th></tr>`;
  if (d.colGroups) {
    const runs = [];
    d.colGroups.forEach((g,i)=>{ if (i && g === d.colGroups[i-1]) runs[runs.length-1].span++; else runs.push({g, span:1}); });
    html += `<tr><td class="corner">${d.groupCorner}</td>` + runs.map(r=>`<th class="colhead" colspan="${r.span}">${r.g}</th>`).join("") + `</tr>`;
  }
  html += `<tr><td class="corner">${d.corner}</td>` + d.cols.map(c=>`<th class="colhead">${c}</th>`).join("") + `</tr>`;
  d.rows.forEach((r,i)=>{
    html += `<tr><td class="rowhead">${r}</td>`;
    d.cols.forEach((c,j)=>{
      const f = i*C+j;
      let cls = "mcell", ans = "";
      if (learning) { ans = d.matrix[i][j]; }
      else if (playing && filled[f]) { cls += " filled"; ans = d.matrix[i][j]; }
      else if (!playing && filled[f] === "missed") { cls += " missed"; ans = d.matrix[i][j]; }
      else if (playing && f === nx) { cls += " next"; }
      html += `<td class="${cls}"><span class="cellans">${ans}</span></td>`;
    });
    html += `</tr>`;
  });
  $("tablewrap").innerHTML = html + `</table>`;
}

function startGridGame(){
  learning = false; $("learnBtn").classList.remove("active");
  $("tabs").classList.add("locked");
  filled = Array(total).fill(false); score = 0;
  { const lim = resolveTime(total); noTimer = (lim === null); secs = noTimer ? 0 : lim; }
  playing = true;
  $("playBtn").disabled = true; $("playBtn").textContent = playBusyLabel();
  $("answerWrap").style.display = "block"; $("giveupRow").style.display = "flex";
  const inp = $("answer"); inp.disabled = false; inp.value = "";
  $("submitBtn").disabled = false;
  $("hint").className = ""; $("hint").textContent = "Any order goes — type a form, press Enter!";
  $("score").textContent = `0/${total}`;
  renderGrid(); tick();
  timerId = setInterval(tick, 1000);
  inp.focus();
}
function stopTimer(){ if (timerId) clearInterval(timerId); timerId = null; }
function tick(){
  if (noTimer){ secs++; $("timer").textContent = fmt(secs); return; }
  $("timer").textContent = fmt(secs);
  if (secs <= 0) { mcActive ? endMC(false, false) : endGame(false); return; }
  secs--;
}
function missedTableHTML(d, idxs){
  if (!idxs.length) return "";
  let html = `<table class="sheet missed-only"><tr><th style="width:40%">Missed</th><th style="width:60%">Answer</th></tr><tbody>`;
  idxs.forEach(i=>{
    html += `<tr><td class="hintcell">${d.hints[i]}</td><td class="answercell missed"><span class="celltext">${d.answers[i]}</span></td></tr>`;
  });
  return html + `</tbody></table>`;
}
function endGame(won, silent){
  stopTimer(); playing = false;
  $("nowQ").style.display = "none";
  $("answer").disabled = true; $("submitBtn").disabled = true;
  $("playBtn").disabled = false; updateHeroLabels();
  $("giveupRow").style.display = "none";
  $("tabs").classList.remove("locked");
  if (!silent) {
    const missedIdx = filled.map((f,i) => f === true ? null : i).filter(x => x !== null);
    $("timer").textContent = fmt(Math.max(secs,0));
    $("tablewrap").innerHTML = missedTableHTML(DATA[current], missedIdx);
    $("hint").className = won ? "good" : "";
    $("hint").textContent = won ? `🏆 Perfect! ${total}/${total} ${timeLeft()}!` : `Time! You got ${score}/${total} — missed answers below.`;
  }
}
$("playBtn").onclick = () => {
  if (activeGroup === "Vocab") {
    buildCustom();
    if (vocabMode === "mc") startMC();
    else { current = "vcustom"; startGridGame(); }
  } else startGridGame();
};
$("giveup").onclick = () => { if (mcActive) endMC(false, false); else endGame(false); };
$("learnBtn").onclick = () => {
  stopGame();
  learning = !learning;
  $("learnBtn").classList.toggle("active", learning);
  resetGridSilent();
  if (learning) { renderGrid(); $("hint").textContent = "Study mode — answers shown. Hit PLAY QUIZ when ready."; }
};
function resetGridSilent(){
  stopTimer(); playing = false;
  filled = Array(total).fill(false); score = 0;
  { const lim = resolveTime(total); secs = lim === null ? 0 : lim; $("timer").textContent = lim === null ? "∞" : fmt(secs); }
  $("score").textContent = `0/${total}`;
  $("playBtn").disabled = false; updateHeroLabels();
  $("answerWrap").style.display = "none"; $("giveupRow").style.display = "none";
  $("tabs").classList.remove("locked");
  if (!learning) { $("hint").className = ""; $("hint").textContent = ""; }
  renderGrid();
}
// (forced order removed — all quizzes accept answers in any order)
$("dirToggle").onclick = () => {
  vocabDir = vocabDir === "la-en" ? "en-la" : "la-en";
  $("dirState").textContent = vocabDir === "la-en" ? "Latin → English" : "English → Latin";
  if (playing) endGame(false, true);
  learning = false; $("learnBtn").classList.remove("active");
  applyDir(DATA[current]);
  resetGrid();
};

// submit with Enter (or the Submit button) — nothing is checked while typing
function submitAnswer(){
  if (!playing) return;
  const inp = $("answer");
  const raw = inp.value.trim(), v = norm(raw);
  if (!v) { $("hint").className = "bad"; $("hint").textContent = "Type something first, then press Enter!"; return; }
  const d = DATA[current];
  {
    const i = d.answers.findIndex((a,idx) => filled[idx] !== true && splitAlt(a).includes(v));
    if (i !== -1) {
      filled[i] = true; score++;
      inp.value = "";
      $("score").textContent = `${score}/${total}`;
      $("hint").className = "good"; $("hint").textContent = `✅ ${d.answers[i]}`;
      renderGrid();
      if (score === total) endGame(true);
    } else {
      $("hint").className = "bad"; $("hint").textContent = `❌ "${raw}" isn't a remaining answer — try again.`;
    }
  }
}
$("answer").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); submitAnswer(); }
});
$("submitBtn").onclick = submitAnswer;

// ---------- custom vocab tester ----------
DATA.vcustom = { title:"Vocab", sub:"", vocab:true, pairs:[], hints:[], answers:[] };
function playIdleLabel(){ return activeGroup === "Vocab" ? "START TEST" : "PLAY QUIZ"; }
function playBusyLabel(){ return activeGroup === "Vocab" ? "TESTING…" : "PLAYING…"; }
function updateHeroLabels(){
  if (!playing) $("playBtn").textContent = playIdleLabel();
  $("learnBtn").textContent = activeGroup === "Vocab" ? "Show All Answers" : "🎓 Learn";
}
function stopGame(){ if (!playing) return; if (mcActive) endMC(false, true); else endGame(false, true); }
function shuffleInPlace(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } }
function escapeHtml(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
function buildCustom(){
  const ids = [...selCh].sort((a,b)=>a-b);
  let pairs = [];
  ids.forEach(c => pairs = pairs.concat(VOCAB[c]));
  const label = ids.length === 8 ? "Stages 1–8" : "Stage" + (ids.length > 1 ? "s " : " ") + ids.join(", ");
  DATA.vcustom.title = "Vocab — " + label;
  DATA.vcustom.pairs = pairs;
  applyDir(DATA.vcustom);
  current = "vcustom"; total = pairs.length;
  const fl = resolveTime(total);
  $("foot").textContent = `${fl === null ? "No time limit" : fmt(fl) + " on the clock"} · ${total} words · type the Latin or pick the answer.`;
}
function selectVocab(){
  learning = false; $("learnBtn").classList.remove("active");
  buildCustom();
  $("orderrow").style.display = "";
  updateHeroLabels();
  resetGrid();
}
function startMC(){
  buildCustom();
  learning = false; $("learnBtn").classList.remove("active");
  const order = DATA.vcustom.pairs.map((_,i)=>i);
  shuffleInPlace(order);
  mc = { order, pos:0, score:0, total:order.length, answered:false, opts:[], correct:"", prompt:"", pair:0 };
  total = mc.total; score = 0; filled = Array(total).fill(false);
  { const lim = resolveTime(total); noTimer = (lim === null); secs = noTimer ? 0 : lim; }
  playing = true; mcActive = true;
  $("tabs").classList.add("locked");
  $("playBtn").disabled = true; $("playBtn").textContent = playBusyLabel();
  $("answerWrap").style.display = "none"; $("giveupRow").style.display = "flex";
  $("hint").className = ""; $("hint").textContent = "Pick the right answer!";
  $("nowQ").style.display = "none";
  $("score").textContent = `0/${total}`;
  tick();
  timerId = setInterval(tick, 1000);
  renderMC();
}
function renderMC(){
  const d = DATA.vcustom;
  const i = mc.order[mc.pos];
  const laEn = vocabDir === "la-en";
  const prompt = laEn ? d.pairs[i][0] : d.pairs[i][1];
  const correct = laEn ? d.pairs[i][1] : d.pairs[i][0];
  const pool = [];
  d.pairs.forEach((p,j)=>{ if (j !== i){ const v = laEn ? p[1] : p[0]; if (v !== correct && !pool.includes(v)) pool.push(v); } });
  shuffleInPlace(pool);
  mc.opts = [correct, ...pool.slice(0,3)];
  shuffleInPlace(mc.opts);
  mc.correct = correct; mc.prompt = prompt; mc.pair = i; mc.answered = false;
  const letters = ["A","B","C","D"];
  let html = `<table class="sheet mcqt"><tr><th colspan="2">Question ${mc.pos+1}/${mc.total} · ${escapeHtml(prompt)}</th></tr><tbody>`;
  mc.opts.forEach((o,k)=>{
    html += `<tr><td class="hintcell">${letters[k]}</td><td class="mcoptcell" onclick="answerMC(${k})"><span class="celltext">${escapeHtml(o)}</span></td></tr>`;
  });
  html += `</tbody></table>`;
  $("tablewrap").innerHTML = html;
}
function answerMC(k){
  if (!playing || !mcActive || mc.answered) return;
  mc.answered = true;
  const cells = document.querySelectorAll("#tablewrap .mcoptcell");
  const ok = mc.opts[k] === mc.correct;
  cells.forEach((b,bi)=>{ b.style.pointerEvents = "none"; if (mc.opts[bi] === mc.correct) b.classList.add("right"); });
  if (ok){
    filled[mc.pair] = true;
    mc.score++; score = mc.score;
    $("score").textContent = `${score}/${total}`;
    $("hint").className = "good"; $("hint").textContent = "✅ Correct!";
  } else {
    cells[k].classList.add("wrong");
    $("hint").className = "bad"; $("hint").textContent = `❌ Correct: ${mc.correct}`;
  }
  setTimeout(()=>{
    if (!playing || !mcActive) return;
    mc.pos++;
    if (mc.pos >= mc.total) endMC(true, false);
    else renderMC();
  }, 850);
}
function endMC(finished, silent){
  stopTimer(); playing = false; mcActive = false;
  $("nowQ").style.display = "none";
  $("playBtn").disabled = false; updateHeroLabels();
  $("giveupRow").style.display = "none";
  $("tabs").classList.remove("locked");
  if (silent) return;
  const missedIdx = filled.map((f,i) => f === true ? null : i).filter(x => x !== null);
  const pct = Math.round(mc.score/mc.total*100);
  $("timer").textContent = fmt(Math.max(secs,0));
  $("hint").className = finished && mc.score === mc.total ? "good" : "";
  $("hint").textContent = finished
    ? (mc.score === mc.total ? `🏆 Perfect! ${mc.total}/${mc.total} ${timeLeft()}!` : `Done! You got ${mc.score}/${mc.total} (${pct}%)`)
    : `Stopped. You got ${mc.score}/${mc.total} — missed answers below.`;
  $("tablewrap").innerHTML = missedTableHTML(DATA.vcustom, missedIdx) + `<div class="btnrow"><button onclick="startMC()">Retry Test</button></div>`;
}
renderGroupbar();
renderQuizTabs();
select("puella");
</script>
</body>
</html>
