<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latin Reference Grammar Quizzes</title>
<style>
:root{--bg:#fff;--fg:#1b2430;--mut:#5b6777;--card:#f3f6fa;--bd:#cfd8e3;--hd:#1d4f91;--hdfg:#fff;--ac:#e8730c;--ok:#d9f2dc;--okfg:#176b2a;--bad:#fde0e0;--badfg:#a31919;--in:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191f;--fg:#e6ebf1;--mut:#9aa7b6;--card:#1e2630;--bd:#33404f;--hd:#245fae;--ok:#1d4a28;--okfg:#9be6ac;--bad:#5a2323;--badfg:#ffb4b4;--in:#10151a}}
:root[data-theme="dark"]{--bg:#14191f;--fg:#e6ebf1;--mut:#9aa7b6;--card:#1e2630;--bd:#33404f;--hd:#245fae;--ok:#1d4a28;--okfg:#9be6ac;--bad:#5a2323;--badfg:#ffb4b4;--in:#10151a}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{background:var(--hd);color:var(--hdfg);padding:14px 20px}
header h1{margin:0;font-size:1.35rem}header p{margin:2px 0 0;opacity:.85;font-size:.9rem}
.wrap{display:grid;grid-template-columns:250px 1fr;gap:20px;max-width:1200px;margin:0 auto;padding:16px}
nav h3{margin:14px 0 4px;font-size:.78rem;text-transform:uppercase;letter-spacing:.06em;color:var(--mut)}
nav h3:first-child{margin-top:0}
nav a{display:block;padding:6px 10px;border-radius:6px;color:var(--fg);text-decoration:none;font-size:.93rem}
nav a:hover{background:var(--card)}nav a.on{background:var(--hd);color:var(--hdfg)}
main{min-width:0}
main h2{margin:0 0 2px}.sec{color:var(--mut);font-size:.85rem;margin-bottom:12px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
button{font:inherit;border:0;border-radius:6px;padding:8px 16px;cursor:pointer;background:var(--hd);color:#fff;font-weight:600}
button.go{background:var(--ac);font-size:1.05rem;padding:10px 26px}button.alt{background:var(--card);color:var(--fg);border:1px solid var(--bd)}
.stat{display:flex;gap:18px;align-items:center;background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:8px 16px;margin:10px 0}
.stat b{font-size:1.5rem;font-variant-numeric:tabular-nums}.stat small{display:block;color:var(--mut);font-size:.72rem;text-transform:uppercase}
.sc{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.95rem}
th,td{border:1px solid var(--bd);padding:6px 10px;text-align:left;white-space:nowrap}
thead th{background:var(--hd);color:var(--hdfg)}tbody th{background:var(--card);font-weight:600}
.s{color:var(--mut)}td b{color:var(--ok-c,#2a7d3f)}
td input{font:inherit;width:8.5em;padding:4px 6px;border:1px solid var(--bd);border-radius:4px;background:var(--in);color:var(--fg)}
td input.ok{background:var(--ok);color:var(--okfg);font-weight:600}td input.miss{background:var(--bad);color:var(--badfg)}
.res{background:var(--card);border-left:5px solid var(--ac);padding:12px 16px;margin:12px 0;border-radius:6px}
.hint{color:var(--mut);font-size:.85rem}
@media(max-width:800px){.wrap{grid-template-columns:1fr}nav{max-height:190px;overflow:auto;border:1px solid var(--bd);border-radius:8px;padding:8px}}
</style>
</head>
<body>
<header><h1>Latin Reference Grammar · Quiz Lab</h1><p>Every table from pages 213–228, each with a timed type-in quiz. Typing without macrons works (amo = amō).</p></header>
<div class="wrap"><nav id="nav"></nav><main id="main"></main></div>
<script>
const P6=["I","you (sg)","he / she / it","we","you (pl)","they"],
C10=["nominative sg","accusative sg","genitive sg","dative sg","ablative sg","nominative pl","accusative pl","genitive pl","dative pl","ablative pl"],
C5=["nominative","accusative","genitive","dative","ablative"],
CJ=["1st conj.","2nd conj.","3rd conj.","4th conj.","mixed conj."];
const R=(l,s)=>s.trim().split("\n").map((x,i)=>[l[i],...x.trim().split(/\s+/).map(c=>c.replace(/_/g," "))]);
const D=s=>s.trim().split("\n").map(x=>x.split("|"));
const T=[
{id:"cases",sec:"Nouns",title:"Cases",hd:["Case","Main role"],rows:D(`nominative|subject
vocative|addressed/addressing
accusative|object
genitive|of/possession
dative|to/for/indirect object
ablative|by/with/from`)},
{id:"declensions",sec:"Nouns",title:"Declension of a noun",hd:["Noun","Declension","Stem"],rows:D(`fēmina|1st|fēmin-
deus|2nd|de-
bellum|2nd|bell-
rēx|3rd|rēg-
flūmen|3rd|flūmin-`)},
{id:"first-decl",sec:"Nouns",title:"1st declension",hd:["","fēmina"],stem:"fēmin",rows:R(C10,"a\nam\nae\nae\nā\nae\nās\nārum\nīs\nīs")},
{id:"second-decl",sec:"Nouns",title:"2nd declension",hd:["","masc (deus)","neuter (bellum)"],stem:["de","bell"],rows:R(C10,"us um\num um\nī ī\nō ō\nō ō\nī a\nōs a\nōrum ōrum\nīs īs\nīs īs")},
{id:"third-decl",sec:"Nouns",title:"3rd declension",hd:["","masc / fem (rēx)","neuter (flūmen)"],stem:["rēg","flūmin"],rows:R(C10,"=(rēx) =(flūmen)\nem =(flūmen)\nis is\nī ī\ne e\nēs a\nēs a\num um\nibus ibus\nibus ibus")},
{id:"adj-212",sec:"Adjectives",title:"2-1-2 adjectives (irātus)",hd:["","masculine","feminine","neuter"],stem:"irāt",rows:R(C10,"us a um\num am um\nī ae ī\nō ae ō\nō ā ō\nī ae a\nōs ās a\nōrum ārum ōrum\nīs īs īs\nīs īs īs")},
{id:"adj-fortis",sec:"Adjectives",title:"3rd declension adjectives: fortis, forte",hd:["","masc / fem","neuter"],stem:"fort",rows:R(C10,"is e\nem e\nis is\nī ī\nī ī\nēs ia\nēs ia\nium ium\nibus ibus\nibus ibus")},
{id:"adj-ingens",sec:"Adjectives",title:"3rd declension adjectives: ingēns, ingentis",hd:["","masc / fem","neuter"],stem:"ingent",rows:R(C10,"=(ingēns) =(ingēns)\nem =(ingēns)\nis is\nī ī\nī ī\nēs ia\nēs ia\nium ium\nibus ibus\nibus ibus")},
{id:"pres-part-decl",sec:"Adjectives",title:"Present participle declension (regēns)",hd:["","masc / fem","neuter"],stem:"regent",rows:R(C10,"=regēns =regēns\nem =regēns\nis is\nī ī\nī ī\nēs ia\nēs ia\nium ium\nibus ibus\nibus ibus")},
{id:"pres-part",sec:"Adjectives",title:"Present participles by conjugation",hd:["Conjugation","Nominative","Genitive","Meaning"],rows:D(`1st|amāns|amantis|loving
2nd|terrēns|terrentis|terrifying
3rd|regēns|regentis|ruling
4th|audiēns|audientis|listening
mixed|capiēns|capientis|taking`)},
{id:"adverb-form",sec:"Adverbs & prepositions",title:"Forming adverbs",hd:["Adjective","Adverb","Meaning"],rows:D(`laetus, laeta, laetum|laetē|happily
fortis, forte|fortiter|bravely/strongly`)},
{id:"adverbs",sec:"Adverbs & prepositions",title:"Common adverbs",flip:1,hd:["Latin","English"],rows:D(`semper|always
etiam|also/even
iterum|again
saepe|often
magnopere|greatly/very much
tum|then
mox|soon
fortiter|bravely/strongly
nunc|now
nōn|not
hic|here
celeriter|quickly
iam|now/already
diū|for a long time
ibi|there
ōlim|once/some time ago
numquam|never
subitō|suddenly
sīc|thus/in this way
tandem|at last/finally`)},
{id:"prepositions",sec:"Adverbs & prepositions",title:"Prepositions",hd:["Preposition","Meaning"],rows:D(`ad + accusative|to/towards/at
contrā + accusative|against
in + accusative|into
per + accusative|through/along
prope + accusative|near
trāns + accusative|across
ā, ab + ablative|from/away from/by
cum + ablative|with
dē + ablative|from/down from/about
ē, ex + ablative|from/out of/out from
in + ablative|in/on`)},
{id:"q-yesno",sec:"Questions",title:"Yes / no question words",hd:["Word","Invites the answer"],rows:D(`-ne|yes or no
nōnne … ?|yes
num … ?|no`)},
{id:"q-words",sec:"Questions",title:"Question words",flip:1,hd:["Latin","English"],rows:D(`cūr?|why
quandō?|when
ubi?|where`)},
{id:"conjugations",sec:"Verbs",title:"Conjugations & principal parts",hd:["1st principal part","Infinitive","Perfect","Conjugation"],rows:D(`amō|amāre|amāvī|1st
terreō|terrēre|terruī|2nd
regō|regere|rēxī|3rd
audiō|audīre|audīvī|4th
capiō|capere|cēpī|mixed`)},
{id:"infinitives",sec:"Verbs",title:"Infinitives",hd:["Conjugation","Infinitive","Meaning"],rows:D(`1st conjugation|amāre|to love
2nd conjugation|terrēre|to frighten
3rd conjugation|regere|to rule
4th conjugation|audīre|to hear
mixed conjugation|capere|to capture`)},
{id:"present",sec:"Verbs",title:"Present tense",hd:["",...CJ],rows:R(P6,`amō terreō regō audiō capiō
amās terrēs regis audīs capis
amat terret regit audit capit
amāmus terrēmus regimus audīmus capimus
amātis terrētis regitis audītis capitis
amant terrent regunt audiunt capiunt`)},
{id:"imperfect",sec:"Verbs",title:"Imperfect tense",hd:["",...CJ],rows:R(P6,`amābam terrēbam regēbam audiēbam capiēbam
amābās terrēbās regēbās audiēbās capiēbās
amābat terrēbat regēbat audiēbat capiēbat
amābāmus terrēbāmus regēbāmus audiēbāmus capiēbāmus
amābātis terrēbātis regēbātis audiēbātis capiēbātis
amābant terrēbant regēbant audiēbant capiēbant`)},
{id:"future",sec:"Verbs",title:"Future tense",hd:["",...CJ],rows:R(P6,`amābō terrēbō regam audiam capiam
amābis terrēbis regēs audiēs capiēs
amābit terrēbit reget audiet capiet
amābimus terrēbimus regēmus audiēmus capiēmus
amābitis terrēbitis regētis audiētis capiētis
amābunt terrēbunt regent audient capient`)},
{id:"perfect",sec:"Verbs",title:"Perfect tense",hd:["",...CJ],rows:R(P6,`amāvī terruī rēxī audīvī cēpī
amāvistī terruistī rēxistī audīvistī cēpistī
amāvit terruit rēxit audīvit cēpit
amāvimus terruimus rēximus audīvimus cēpimus
amāvistis terruistis rēxistis audīvistis cēpistis
amāvērunt terruērunt rēxērunt audīvērunt cēpērunt`)},
{id:"imperatives",sec:"Verbs",title:"Imperatives",hd:["",...CJ],rows:R(["imperative (sg)","imperative (pl)"],`amā terrē rege audī cape
amāte terrēte regite audīte capite`)},
{id:"sum",sec:"Irregular verbs",title:"sum, esse, fuī – be",hd:["","present","imperfect","future"],rows:R(P6,`sum eram erō
es erās eris
est erat erit
sumus erāmus erimus
estis erātis eritis
sunt erant erunt`)},
{id:"possum",sec:"Irregular verbs",title:"possum, posse, potuī – can",hd:["","present","imperfect","future"],rows:R(P6,`possum poteram poterō
potes poterās poteris
potest poterat poterit
possumus poterāmus poterimus
potestis poterātis poteritis
possunt poterant poterunt`)},
{id:"eo",sec:"Irregular verbs",title:"eō, īre, iī – go",hd:["","present","imperfect","future"],rows:R(P6,`eō ībam ībō
īs ībās ībis
it ībat ībit
īmus ībāmus ībimus
ītis ībātis ībitis
eunt ībant ībunt`)},
{id:"volo",sec:"Irregular verbs",title:"volō, velle, voluī – want",hd:["","present","imperfect","future"],rows:R(P6,`volō volēbam volam
vīs volēbās volēs
vult volēbat volet
volumus volēbāmus volēmus
vultis volēbātis volētis
volunt volēbant volent`)},
{id:"nolo",sec:"Irregular verbs",title:"nōlō, nolle, nōluī – not want",hd:["","present","imperfect","future"],rows:R(P6,`nōlō nōlēbam nōlam
nōn_vīs nōlēbās nōlēs
nōn_vult nōlēbat nōlet
nōlumus nōlēbāmus nōlēmus
nōn_vultis nōlēbātis nōlētis
nōlunt nōlēbant nōlent`)},
{id:"fero",sec:"Irregular verbs",title:"ferō, ferre, tulī – carry",hd:["","present","imperfect","future","perfect"],rows:R(P6,`ferō ferēbam feram tulī
fers ferēbās ferēs tulistī
fert ferēbat feret tulit
ferimus ferēbāmus ferēmus tulimus
fertis ferēbātis ferētis tulistis
ferunt ferēbant ferent tulērunt`)},
{id:"irr-imp",sec:"Irregular verbs",title:"Irregular imperatives & participles",hd:["Verb","Imperative sg","Imperative pl","Participle (nom)","Participle (gen)"],rows:D(`eō|ī|ite|iēns|euntis
volō|—|—|volēns|volentis
nōlō|nōlī|nōlīte|nōlēns|nōlentis
ferō|fer|ferte|ferēns|ferentis`)},
{id:"numbers",sec:"Numbers",title:"Numbers 1–1000",flip:1,hd:["Latin","Number"],rows:D(`ūnus|1
duo|2
trēs|3
quattuor|4
quinque|5
sex|6
septem|7
octō|8
novem|9
decem|10
centum|100
mille|1000
mīlia / mīlium|1000s`)},
{id:"ordinals",sec:"Numbers",title:"Ordinals",flip:1,hd:["Latin","English"],rows:D(`prīmus|first
secundus|second
tertius|third
quārtus|fourth
quīntus|fifth
sextus|sixth
septimus|seventh
octāvus|eighth
nōnus|ninth
decimus|tenth`)},
{id:"one",sec:"Numbers",title:"“one” declined",hd:["","masculine","feminine","neuter"],rows:R(C5,`ūnus ūna ūnum
ūnum ūnam ūnum
ūnīus ūnīus ūnīus
ūnī ūnī ūnī
ūnō ūnā ūnō`)},
{id:"two",sec:"Numbers",title:"“two” declined",hd:["","masculine","feminine","neuter"],rows:R(C5,`duo duae duo
duōs duās duo
duōrum duārum duōrum
duōbus duābus duōbus
duōbus duābus duōbus`)},
{id:"three",sec:"Numbers",title:"“three” declined",hd:["","masc / fem","neuter"],rows:R(C5,`trēs tria
trēs tria
trium trium
tribus tribus
tribus tribus`)}
];
const N=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]/g,"");
const $=id=>document.getElementById(id);
const stemOf=(t,c)=>Array.isArray(t.stem)?t.stem[c]:t.stem;
const lit=v=>v[0]==="=",txt=v=>lit(v)?v.slice(1):v;
let cur,mode="ref",flip=false,S=null;
function nav(){let h="",sec="";T.forEach(t=>{if(t.sec!==sec){sec=t.sec;h+=`<h3>${sec}</h3>`}h+=`<a href="#${t.id}" data-id="${t.id}">${t.title}</a>`});$("nav").innerHTML=h}
function best(id){try{return JSON.parse(localStorage.getItem("best-"+id))}catch(e){return null}}
function save(id,v){try{localStorage.setItem("best-"+id,JSON.stringify(v))}catch(e){}}
const fmt=s=>Math.floor(s/60)+":"+String(Math.floor(s%60)).padStart(2,"0");
function show(){
  stop();const id=location.hash.slice(1);cur=T.find(t=>t.id===id)||T[0];
  document.querySelectorAll("nav a").forEach(a=>a.classList.toggle("on",a.dataset.id===cur.id));
  mode="ref";flip=false;render();
}
function stop(){if(S&&S.iv)clearInterval(S.iv);S=null}
function render(){
  const t=cur,b=best(t.id);
  let h=`<h2>${t.title}</h2><div class="sec">${t.sec}${b?` · best ${b.s}/${b.n} in ${fmt(b.t)}`:""}</div>
  <div class="bar"><button class="${mode==="ref"?"":"alt"}" data-m="ref">Reference</button><button class="${mode==="quiz"?"":"alt"}" data-m="quiz">Quiz</button>${mode==="quiz"&&t.flip?`<button class="alt" id="flip">Flip direction</button>`:""}</div>`;
  if(mode==="ref"){h+=`<div class="sc">${refTable(t)}</div>`}
  else{h+=`<div class="stat" id="stat"><div><small>Score</small><b id="sc">0/${count(t)}</b></div><div><small>Time</small><b id="tm">${fmt(limit(t))}</b></div><button class="go" id="start">Start Quiz</button><button class="alt" id="give" style="display:none">Give Up</button></div><div class="hint" id="hint">Fill in every blank${t.stem?" — the stem is shown, type only the ending":""}. Correct answers lock in automatically. ${t.rows.some(r=>r.some(c=>c.includes("/")))?"Where several answers are shown separated by “/”, any one of them is accepted.":""}</div><div id="res"></div><div class="sc">${quizTable(t)}</div>`}
  $("main").innerHTML=h;
}
const count=t=>{let n=0;view(t).rows.forEach(r=>r.slice(1).forEach(c=>{if(c!=="—")n++}));return n};
const limit=t=>Math.max(60,count(t)*6);
function view(t){if(flip&&t.flip)return{hd:[t.hd[1],t.hd[0]],rows:t.rows.map(r=>[r[1],r[0]]),stem:null};return{hd:t.hd,rows:t.rows,stem:t.stem}}
function refTable(t){
  let h="<table><thead><tr>"+t.hd.map(x=>`<th>${x}</th>`).join("")+"</tr></thead><tbody>";
  t.rows.forEach(r=>{h+=`<tr><th>${r[0]}</th>`+r.slice(1).map((v,i)=>{const s=stemOf(t,i);return `<td>${s&&!lit(v)?`<span class="s">${s}-</span><b>${v}</b>`:txt(v)}</td>`}).join("")+"</tr>"});
  return h+"</tbody></table>";
}
function quizTable(t){
  const v=view(t);
  let h="<table id=\"qt\"><thead><tr>"+v.hd.map(x=>`<th>${x}</th>`).join("")+"</tr></thead><tbody>";
  v.rows.forEach(r=>{h+=`<tr><th>${r[0]}</th>`+r.slice(1).map((c,i)=>{
    if(c==="—")return "<td>—</td>";
    const s=v.stem?stemOf({stem:v.stem},i):null,e=txt(c);
    return `<td>${s&&!lit(c)?`<span class="s">${s}-</span>`:""}<input disabled autocomplete="off" autocapitalize="none" spellcheck="false" data-a="${e.replace(/"/g,"&quot;")}"></td>`}).join("")+"</tr>"});
  return h+"</tbody></table>";
}
function start(){
  const t=cur,n=count(t);
  S={n,s:0,t0:Date.now(),lim:limit(t)};
  document.querySelectorAll("#qt input").forEach(i=>{i.disabled=false});
  const f=document.querySelector("#qt input");if(f)f.focus();
  $("start").style.display="none";$("give").style.display="";
  S.iv=setInterval(()=>{const left=S.lim-(Date.now()-S.t0)/1000;$("tm").textContent=fmt(Math.max(0,left));if(left<=0)finish("Time’s up!")},250);
}
function finish(msg){
  if(!S)return;clearInterval(S.iv);
  const el=Math.min(S.lim,(Date.now()-S.t0)/1000),{s,n}=S;
  document.querySelectorAll("#qt input").forEach(i=>{i.disabled=true;if(!i.classList.contains("ok")){i.value=i.dataset.a.split("/")[0]===i.dataset.a?i.dataset.a:i.dataset.a;i.classList.add("miss")}});
  const b=best(cur.id);if(!b||s>b.s||(s===b.s&&el<b.t))save(cur.id,{s,n,t:Math.round(el)});
  $("res").innerHTML=`<div class="res"><b>${msg}</b> You got ${s} of ${n} (${Math.round(100*s/n)}%) in ${fmt(el)}.${s===n?" Perfect! 🏛️":" Missed answers are shown in red."}</div>`;
  $("give").style.display="none";$("start").style.display="";$("start").textContent="Play again";
  S=null;
}
function onInput(e){
  const i=e.target;if(!S||!i.matches("#qt input")||i.disabled)return;
  const a=i.dataset.a,ok=[...a.split("/"),a].map(N).filter(Boolean);
  if(ok.includes(N(i.value))){
    i.value=a;i.classList.add("ok");i.disabled=true;S.s++;$("sc").textContent=S.s+"/"+S.n;
    const all=[...document.querySelectorAll("#qt input")],nx=all.slice(all.indexOf(i)+1).find(x=>!x.disabled)||all.find(x=>!x.disabled);
    if(nx)nx.focus();
    if(S.s===S.n)finish("Finished!");
  }
}
document.addEventListener("click",e=>{
  const m=e.target.dataset&&e.target.dataset.m;
  if(m){stop();mode=m;render();return}
  if(e.target.id==="flip"){stop();flip=!flip;render();return}
  if(e.target.id==="start"){if(mode==="quiz"){render();start()}}
  if(e.target.id==="give")finish("Gave up.");
});
document.addEventListener("input",onInput);
window.addEventListener("hashchange",show);
nav();show();
</script>
</body>
</html>
